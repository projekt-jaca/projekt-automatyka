<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Kontrola kompletności montażu</title>
  <desc id="desc">Ilustracja systemu wizyjnego sprawdzającego obecność sześciu komponentów i wykrywającego brak jednego elementu.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="cam2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="1" stop-color="#1457d9"/>
    </linearGradient>
    <pattern id="grid2" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-width="1" opacity=".38"/>
    </pattern>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" rx="44" fill="url(#bg2)"/>
  <rect width="1000" height="1000" rx="44" fill="url(#grid2)"/>

  <g transform="translate(70 72)">
