      <circle r="92" fill="none" stroke="#22c55e" stroke-width="8"/>
      <circle r="13" fill="#22c55e"/>
      <text x="-18" y="7" fill="#fff">✓</text>
    </g>
    <g transform="translate(700 450)">
      <circle r="72" fill="#e8eef5" stroke="#334155" stroke-width="7"/>
      <circle r="92" fill="none" stroke="#22c55e" stroke-width="8"/>
      <circle r="13" fill="#22c55e"/>
      <text x="-18" y="7" fill="#fff">✓</text>
    </g>

    <g transform="translate(300 660)">
      <circle r="72" fill="#e8eef5" stroke="#334155" stroke-width="7"/>
      <circle r="92" fill="none" stroke="#22c55e" stroke-width="8"/>
      <circle r="13" fill="#22c55e"/>
      <text x="-18" y="7" fill="#fff">✓</text>
    </g>
    <g transform="translate(500 660)">
      <circle r="72" fill="#e8eef5" stroke="#334155" stroke-width="7"/>
      <circle r="92" fill="none" stroke="#22c55e" stroke-width="8"/>
      <circle r="13" fill="#22c55e"/>
      <text x="-18" y="7" fill="#fff">✓</text>
