<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Kontrola geometrii detalu</title>
  <desc id="desc">Ilustracja systemu wizyjnego mierzącego kontur, średnicę otworu i wymiary detalu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="1" stop-color="#1457d9"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-width="1" opacity=".38"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" rx="44" fill="url(#bg)"/>
  <rect width="1000" height="1000" rx="44" fill="url(#grid)"/>

  <g transform="translate(70 72)">
    <rect width="238" height="54" rx="27" fill="#dbeafe"/>
    <circle cx="28" cy="27" r="8" fill="#2f7cff"/>
    <text x="50" y="34" fill="#195cd9" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">KONTROLA GEOMETRII</text>
  </g>

  <g transform="translate(720 90)" filter="url(#shadow)">
    <rect x="0" y="28" width="180" height="122" rx="28" fill="url(#cam)"/>
    <rect x="40" y="0" width="92" height="44" rx="15" fill="#0f172a"/>
    <circle cx="90" cy="89" r="42" fill="#0b1220"/>
    <circle cx="90" cy="89" r="25" fill="#8ec5ff"/>
    <circle cx="90" cy="89" r="11" fill="#dbeafe"/>
  </g>

  <g opacity=".30" stroke="#2f7cff" stroke-width="3">
    <path d="M810 246 L645 340"/>
    <path d="M810 246 L700 530"/>
    <path d="M810 246 L430 300"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M190 370 L250 270 L520 235 L735 385 L650 690 L315 735 L165 585 Z"
          fill="#a9b6c7" stroke="#334155" stroke-width="10" stroke-linejoin="round"/>
    <path d="M165 346 L236 245 L528 205 L770 378 L676 725 L298 770 L134 606 Z"
          fill="none" stroke="#22c55e" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <circle cx="454" cy="456" r="82" fill="#edf2f7" stroke="#334155" stroke-width="10"/>
  <circle cx="454" cy="456" r="103" fill="none" stroke="#f59e0b" stroke-width="8"/>
  <circle cx="454" cy="456" r="5" fill="#334155"/>

  <g stroke="#2563eb" stroke-width="7" fill="none">
    <line x1="205" y1="820" x2="700" y2="820"/>
    <line x1="205" y1="795" x2="205" y2="845"/>
    <line x1="700" y1="795" x2="700" y2="845"/>
  </g>
  <rect x="360" y="786" width="190" height="68" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="455" y="830" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="31" font-weight="700">482.6 mm</text>

  <path d="M548 404 C610 365 664 355 724 365" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <rect x="672" y="329" width="194" height="66" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="769" y="371" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="29" font-weight="700">Ø 83.2 mm</text>

  <g transform="translate(98 876)">
    <rect width="146" height="54" rx="18" fill="#dcfce7"/>
    <circle cx="30" cy="27" r="10" fill="#22c55e"/>
    <path d="M25 27l4 4 8-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="53" y="34" fill="#15803d" font-family="Arial, sans-serif" font-size="20" font-weight="700">WYNIK OK</text>
  </g>
</svg>